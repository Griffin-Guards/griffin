<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIFFIN · app</title>
<meta property="og:title" content="GRIFFIN · make an agent Safe on Robinhood Chain">
<meta property="og:image" content="https://griffinguard.fun/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://griffinguard.fun/og-image.png">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#16213a;--deep:#0d1424;--cream:#f4ead6;--paper:#f6f2e8;--ink:#0d1220;--muted:#5d6475;--gold:#f2a531;--line:#d9d2c2;--ok:#2f7a4f;--rev:#c0473a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 'Space Grotesk',system-ui,sans-serif}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace;word-break:break-all}
.top{background:var(--deep);color:var(--cream);border-bottom:3px solid var(--gold)}
.top .in{max-width:880px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.top a{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.14em;margin-right:auto}
.top img{width:30px;height:30px;border-radius:6px}
main{max-width:880px;margin:0 auto;padding:26px 20px 60px}
h2{font:400 28px 'DM Serif Display',serif;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);padding:22px 24px;margin-bottom:18px}
.muted{color:var(--muted)}
label{display:block;font-weight:500;margin:12px 0 0}
label span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
label.check{display:flex;gap:10px;align-items:center}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:3px;font:14px 'JetBrains Mono',monospace;background:var(--paper)}
label.check input{width:auto;margin:0}
textarea{resize:vertical}
button{font:700 14px 'Space Grotesk',sans-serif;padding:10px 16px;border-radius:3px;border:2px solid var(--navy);background:#fff;color:var(--ink);cursor:pointer;margin-top:12px;white-space:nowrap}
button.gold{background:var(--gold);border-color:var(--gold)}
button.ghost{background:transparent;border-color:transparent;padding-left:0}
button.danger{background:var(--rev);border-color:var(--rev);color:#fff}
.top button{margin:0;background:var(--gold);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row input{flex:1;min-width:180px}.row button{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;margin:12px 0 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.ok{color:var(--ok)}.no{color:var(--rev)}
.saved{padding-left:18px;font:13px 'JetBrains Mono',monospace;word-break:break-all}
.ledger{width:100%;border-collapse:collapse;font:13px 'JetBrains Mono',monospace}
.ledger td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.busy,.err,.note{padding:10px 14px;margin-bottom:14px;border-left:4px solid}
.busy{background:#fff4dc;border-color:var(--gold)}.err{background:#fbe4e0;border-color:var(--rev)}.note{background:#e2f0e6;border-color:var(--ok)}
@media (max-width:640px){.two,.facts{grid-template-columns:1fr}.facts dd{margin-bottom:6px}}
</style>
</head>
<body>
<div class="top"><div class="in"><a href="/"><img src="/logo.png" alt="">GRIFFIN</a><span id="who"></span></div></div>
<main id="main"></main>
<script src="/app/app.js"></script>
</body>
</html>
