name = "griffin"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Your own domain, once the zone is in your Cloudflare account:
# routes = [{ pattern = "example.com", custom_domain = true }]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/v1", "/mcp", "/rpc"]

# Create with `npx wrangler d1 create griffin` and paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "griffin"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
GUARD_PER_DAY = "500"
TOKEN_ADDRESS = ""
SITE_URL = ""
# Secrets (not here):
#   npx wrangler secret put GRIFFIN_SECRET   (base58 secret key of Griffin's vote key)
#   npx wrangler secret put SOL_RPC_URL      (mainnet RPC URL)
